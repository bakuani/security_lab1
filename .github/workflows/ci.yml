name: Secure API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sast:
    name: Tests and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration tests and package
        run: ./mvnw -B -ntp verify
      - name: Verify API with curl
        run: python3 scripts/smoke-test.py --start
      - name: SAST - SpotBugs and Find Security Bugs
        run: ./mvnw -B -ntp spotbugs:spotbugs spotbugs:check
      - name: Publish SAST summary
        if: always()
        run: python3 scripts/security-summary.py sast >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and SAST reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-and-sast
          path: |
            target/surefire-reports/
            target/spotbugs*
            target/smoke/results.json
            target/smoke/transcript.md
          if-no-files-found: error

  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Daily database cache key
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore NVD database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-13-${{ runner.os }}-${{ steps.date.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            nvd-13-${{ runner.os }}-${{ steps.date.outputs.day }}-
            nvd-13-${{ runner.os }}-
      - name: SCA - fail on CVSS 7 or greater
        env:
          MAVEN_OPTS: -Xmx4g
        run: ./mvnw -B -ntp dependency-check:check
      - name: Publish SCA summary
        if: always()
        run: python3 scripts/security-summary.py sca >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: error
